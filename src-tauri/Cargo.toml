[package]
name = "altdeck"
version = "0.1.0"
description = "A local-first Roblox account manager"
edition = "2021"
license = "MIT"

[lib]
name = "altdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
argon2 = "0.5"
aes-gcm = "0.10"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
sha2 = "0.10"
tempfile = "3"
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk"] }
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
arboard = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography",
  "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_SystemInformation", "Win32_Storage_Xps",
  "Win32_System_Registry", "Win32_Security_WinTrust",
  "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_System_DataExchange", "Win32_System_Ole",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_ProcessStatus",
  "Security_Credentials_UI", "Foundation"
] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
